<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password Strength Checker</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f5f7; display: flex; justify-content: center; padding: 40px 16px; }
  .card { background: #fff; width: 100%; max-width: 440px; padding: 28px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  h1 { margin-top: 0; font-size: 22px; }
  label { display: block; font-size: 14px; margin: 14px 0 4px; color: #444; }
  input { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
  .bar { height: 12px; background: #e3e5e8; border-radius: 6px; margin-top: 18px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: #d33; transition: width .25s, background .25s; }
  .score { display: flex; justify-content: space-between; margin-top: 8px; font-weight: 600; }
  ul { list-style: none; padding: 0; margin: 16px 0 0; font-size: 14px; }
  li { padding: 4px 0; color: #888; }
  li.ok { color: #1a8f3c; }
  li.ok::before { content: "✓ "; }
  li:not(.ok)::before { content: "✗ "; }
  small { color: #777; display: block; margin-top: 16px; }
</style>
</head>
<body>
<div class="card">
  <h1>Password Strength Checker</h1>

  <label for="name">Your name (optional, so we can check it isn't in your password)</label>
  <input id="name" type="text" autocomplete="off">

  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="off">
  <label style="display:flex;gap:6px;align-items:center;margin-top:8px">
    <input type="checkbox" id="show" style="width:auto"> Show password
  </label>

  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="score"><span id="label">Type something</span><span id="score">0 / 100</span></div>

  <ul id="rules"></ul>
  <small>Everything runs in your browser. Nothing is sent anywhere.</small>
</div>

<script>
// A few very common passwords. In a bigger version, load a real list (e.g. top 10,000).
const COMMON = ["password","123456","12345678","qwerty","abc123","letmein","admin",
                "welcome","iloveyou","monkey","dragon","football","111111","password1"];

// Each rule: text to show, and a test that returns true when the rule is passed.
function getRules(pw, name) {
  const lowerPw = pw.toLowerCase();
  const nameParts = name.toLowerCase().split(/\s+/).filter(p => p.length >= 3);
  return [
    { text: "At least 8 characters",        ok: pw.length >= 8 },
    { text: "At least 12 characters (better)", ok: pw.length >= 12 },
    { text: "Has a lowercase letter",       ok: /[a-z]/.test(pw) },
    { text: "Has an uppercase letter",      ok: /[A-Z]/.test(pw) },
    { text: "Has a number",                 ok: /\d/.test(pw) },
    { text: "Has a symbol (!@#$...)",       ok: /[^A-Za-z0-9]/.test(pw) },
    { text: "Doesn't contain your name",    ok: !nameParts.some(p => lowerPw.includes(p)) },
    { text: "Not a common password",        ok: !COMMON.includes(lowerPw) },
    { text: "No 3+ repeated characters (aaa)", ok: !/(.)\1\1/.test(pw) },
    { text: "No simple sequences (abc, 123)", ok: !hasSequence(lowerPw) },
  ];
}

// Looks for 3 characters in a row that go up by one (abc, 123, xyz).
function hasSequence(s) {
  for (let i = 0; i < s.length - 2; i++) {
    const a = s.charCodeAt(i), b = s.charCodeAt(i + 1), c = s.charCodeAt(i + 2);
    if (b === a + 1 && c === b + 1) return true;
  }
  return false;
}

function calculateScore(pw, name) {
  if (!pw) return 0;
  const lowerPw = pw.toLowerCase();
  let score = 0;

  // 1) Length: up to 40 points (full marks at 16+ characters)
  score += Math.min(pw.length, 16) / 16 * 40;

  // 2) Variety: 10 points for each character type, up to 40
  if (/[a-z]/.test(pw)) score += 10;
  if (/[A-Z]/.test(pw)) score += 10;
  if (/\d/.test(pw))    score += 10;
  if (/[^A-Za-z0-9]/.test(pw)) score += 10;

  // 3) Uniqueness: up to 20 points for using many different characters
  score += (new Set(pw).size / pw.length) * 20;

  // 4) Penalties
  const nameParts = name.toLowerCase().split(/\s+/).filter(p => p.length >= 3);
  if (nameParts.some(p => lowerPw.includes(p))) score -= 20;
  if (/(.)\1\1/.test(pw)) score -= 10;
  if (hasSequence(lowerPw)) score -= 10;
  if (pw.length < 8) score = Math.min(score, 30);          // too short = never "good"
  if (COMMON.includes(lowerPw)) score = Math.min(score, 5); // very common = basically useless

  return Math.max(0, Math.min(100, Math.round(score)));
}

function getLabel(score) {
  if (score < 40) return { text: "Weak",        color: "#d33" };
  if (score < 70) return { text: "Medium",      color: "#e8a000" };
  if (score < 90) return { text: "Strong",      color: "#6aa800" };
  return              { text: "Very strong",    color: "#1a8f3c" };
}

const pwInput = document.getElementById("pw");
const nameInput = document.getElementById("name");

function update() {
  const pw = pwInput.value, name = nameInput.value;
  const score = calculateScore(pw, name);
  const label = getLabel(score);

  const fill = document.getElementById("fill");
  fill.style.width = score + "%";
  fill.style.background = label.color;
  document.getElementById("score").textContent = score + " / 100";
  document.getElementById("label").textContent = pw ? label.text : "Type something";

  const list = document.getElementById("rules");
  list.textContent = "";
  for (const rule of getRules(pw, name)) {
    const li = document.createElement("li");
    li.textContent = rule.text;
    if (pw && rule.ok) li.className = "ok";
    list.appendChild(li);
  }
}

pwInput.addEventListener("input", update);
nameInput.addEventListener("input", update);
document.getElementById("show").addEventListener("change", e => {
  pwInput.type = e.target.checked ? "text" : "password";
});
update();
</script>
</body>
</html>
